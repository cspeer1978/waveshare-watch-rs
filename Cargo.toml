[package]
name = "waveshare-watch-rs"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# ESP HAL + Runtime
esp-hal = { version = "1.0.0", default-features = true, features = ["esp32s3", "unstable", "psram"] }
esp-rtos = { version = "0.2.0", features = ["esp32s3", "embassy", "esp-radio"] }
esp-alloc = "0.9.0"
# Force USB output: the "auto" mode in 0.16.1 checks the wrong register on the
# ESP32-S3 (0x6003_8000 = USB FIFO instead of 0x6003_8008 = INT_RAW), decides no
# USB host is there and prints to UART0 pins that are not on the USB-C port.
esp-println = { version = "0.16.1", default-features = false, features = ["esp32s3", "log-04", "jtag-serial", "colors", "critical-section"] }
# No "panic-handler": main.rs has its own, which saves the crash message and restarts.
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "println"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
log = "0.4"

# Embassy async runtime
embassy-executor = "0.9.0"
embassy-time = "0.5.1"
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2.1"

# Graphics
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"

# HAL traits
embedded-hal = "1.0"
embedded-hal-bus = "0.3"

# WiFi / Networking
esp-radio = { version = "0.17.0", features = ["esp32s3", "wifi", "ble", "coex", "unstable", "log-04"] }
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns"] }

# Peripheral drivers
axp2101-embedded = "0.3"
embedded-sdmmc = "0.8"
embedded-io = "0.6"
embedded-io-async = "0.6"

# MP3 decoding
nanomp3 = "0.1"

# Math (sin/cos/atan2/acos for Sun & Moon, Level, Asteroids) and QR encoding (Wi-Fi QR)
libm = "0.2"
qrcodegen-no-heap = "1.8"

# Flash access for the battery log (0.8.x is the line that matches esp-hal 1.0)
esp-storage = { version = "0.8", features = ["esp32s3"] }
embedded-storage = "0.3"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
